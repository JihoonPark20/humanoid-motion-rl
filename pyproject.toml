[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-mujoco"
version = "0.1.0"
description = "Unofficial ZEST and HuMBLE for Unitree G1 with CPU MuJoCo and MPS/CUDA learning"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*LICENSE", "licenses/dependencies/*.txt", "zest/resources/robots/UNITREE_LICENSE"]
dependencies = ["mujoco==3.17.0", "torch>=2.6,<3", "rsl-rl-lib==5.5.2", "numpy>=1.26", "scipy>=1.12", "tensordict>=0.7", "tensorboard", "h5py>=3.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
viewer = ["mjviser==0.0.16; python_version >= '3.11'"]

[project.scripts]
zest-train = "zest.scripts.train:main"
zest-play = "zest.scripts.play:main"
zest-evaluate = "zest.scripts.evaluate:main"
zest-data = "zest.scripts.hold_data:main"
humble-data = "zest.scripts.hold_data:main"
humble-train = "zest.scripts.humble_train:main"
humble-play = "zest.scripts.humble_play:main"
humble-evaluate = "zest.scripts.humble_evaluate:main"
zest-view = "zest.scripts.view:main"

[tool.setuptools.packages.find]
include = ["zest*"]

[tool.setuptools.package-data]
zest = ["resources/robots/UNITREE_LICENSE", "resources/robots/g1/*.xml", "resources/robots/g1/*.json", "resources/robots/g1/meshes/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
